name: Publish container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }} ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        image: [relay, relay-gateway]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
          - image: relay
            dockerfile: Dockerfile
          - image: relay-gateway
            dockerfile: gateway/Dockerfile
    env:
      IMAGE_NAME: ghcr.io/uniclipboard/${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare architecture tag
        run: |
          {
            echo "PLATFORM_PAIR=${platform//\//-}"
            echo "ARCH=${platform#linux/}"
            echo "SHA_TAG=sha-${GITHUB_SHA:0:7}"
          } >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture tag
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}-${{ env.ARCH }}

  publish:
    name: Publish ${{ matrix.image }} manifest
    strategy:
      fail-fast: false
      matrix:
        image: [relay, relay-gateway]
    env:
      IMAGE_NAME: ghcr.io/uniclipboard/${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Create and verify published image
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/publication
        run: ./scripts/publish-image.sh

      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-${{ matrix.image }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
          retention-days: 7
