# SPDX-License-Identifier: AGPL-3.0-only
#
# UniClipboard Relay v2 — Direct-to-S3 Headless Microservices
#
# Services:
#   - hyper: Zero-knowledge Relay HTTP API v2 control plane. Clients upload and
#            download encrypted chunks directly against configured S3-compatible
#            object storage (Tencent COS, Cloudflare R2, AWS S3, Aliyun OSS, MinIO).
#   - minio: Optional local S3-compatible storage (--profile minio) for self-hosted
#            single-box deployments without external cloud object storage.
#   - p2p:   Reserved slot for future Tailcat DERP relay sharing RELAY_* credentials.

services:
  hyper:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/uniclipboard/hyper-relay:latest
    container_name: uniclipboard-hyper-relay
    restart: unless-stopped
    ports:
      - "${HYPER_PUBLISH_ADDR:-127.0.0.1}:${HYPER_PORT:-8080}:8080"
    environment:
      # Shared relay admission credentials (reused by hyper and future p2p services)
      RELAY_ACCESS_KEY: ${RELAY_ACCESS_KEY:-}
      RELAY_ALLOWED_PUBKEYS: ${RELAY_ALLOWED_PUBKEYS:-}

      # Hyper relay control-plane settings
      HYPER_ADDR: ":8080"
      HYPER_ORIGIN: ${HYPER_ORIGIN:-}
      HYPER_MAX_TRANSFER_BYTES: ${HYPER_MAX_TRANSFER_BYTES:-26214400}
      HYPER_DEFAULT_TTL: ${HYPER_DEFAULT_TTL:-10m}
      HYPER_MAX_TTL: ${HYPER_MAX_TTL:-30m}
      HYPER_MAX_SENDERS: ${HYPER_MAX_SENDERS:-64}
      HYPER_MAX_TRANSFERS: ${HYPER_MAX_TRANSFERS:-32}
      HYPER_KEEPALIVE_INTERVAL: ${HYPER_KEEPALIVE_INTERVAL:-25s}

      # S3-compatible object storage (Tencent COS, Cloudflare R2, AWS S3, Aliyun OSS, MinIO)
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required (e.g. https://cos.ap-guangzhou.myqcloud.com)}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-mailboxes}
      S3_PRESIGN_TTL: ${S3_PRESIGN_TTL:-5m}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/hyper-relay", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional self-hosted S3-compatible storage for local/NAS single-host setups:
  #   docker compose --profile minio up -d
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    container_name: uniclipboard-relay-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PUBLISH_ADDR:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-strong-password}
    volumes:
      - minio_data:/data

  # ---------------------------------------------------------------------------
  # Reserved: P2P Relay (Tailcat DERP) — Out of scope for v2 initial release
  # ---------------------------------------------------------------------------
  # p2p:
  #   profiles: ["p2p"]
  #   image: ghcr.io/uniclipboard/p2p-relay:latest
  #   restart: unless-stopped
  #   ports:
  #     - "${P2P_DERP_PORT:-443}:443/tcp"
  #     - "${P2P_STUN_PORT:-3478}:3478/udp"
  #   environment:
  #     RELAY_ACCESS_KEY: ${RELAY_ACCESS_KEY:-}
  #     RELAY_ALLOWED_PUBKEYS: ${RELAY_ALLOWED_PUBKEYS:-}

volumes:
  minio_data:
