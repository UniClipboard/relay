[package]
name = "uniclipboard-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
publish = false
description = "Token-protected relay server for UniClipboard"

[dependencies]
blake3 = "1.8.2"
clap = { version = "4.5.50", features = ["derive", "env"] }
constant_time_eq = "0.4.2"
iroh-relay = { version = "=1.0.0-rc.1", features = ["server"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
zeroize = "1.8.2"

[dev-dependencies]
iroh-base = { version = "=1.0.0-rc.1", features = ["key", "relay"], default-features = false }
iroh-dns = "=1.0.0-rc.1"
iroh-relay = { version = "=1.0.0-rc.1", features = ["test-utils"] }
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
